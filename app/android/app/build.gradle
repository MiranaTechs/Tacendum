apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ---------------------------------------------------------------------------
// FCM — EVERYTHING CONDITIONAL ON google-services.json.
//
// The Firebase project's google-services.json is deliberately not part of
// this repository; without it beside this file, this build is exactly the
// no-GMS build. So ONE file-presence check gates all five pieces of
// Firebase wiring, and each names this flag rather than re-testing the
// file:
//
//   1. the com.google.gms.google-services plugin (below) — it HARD-FAILS the
//      build when the file is missing, which is why it cannot be uncondi-
//      tional; its classpath entry in the root build.gradle is gated on the
//      same check;
//   2. the firebase-messaging dependency (BOM-pinned in the dependencies
//      block; sha256-pinned in gradle/verification-metadata.xml — the
//      com.google.* groups are excluded from the trust rule there, so a
//      substituted artifact fails the build — the same pinning discipline
//      applied to the other dependency whose bytes decide when this phone
//      wakes);
//   3. the `src/play/` source dir — TacendumFcmService extends a Firebase
//      class and cannot compile without it, so the file is only IN the build
//      when Firebase is (everything with logic stays in src/main, tested and
//      audited in both states);
//   4. the manifest placeholder `tacendumFcmEnabled` — the declared service
//      element is disabled in an unwired build (see AndroidManifest.xml);
//   5. BuildConfig.TACENDUM_FCM — how the JS-visible constant
//      (TacendumMessagingModule's `pushTransport`) tells the Settings copy
//      which truth to speak: a binary must describe ITSELF.
//
// ACTIVATION: drop a Firebase project's google-services.json at
// app/android/app/google-services.json and rebuild. No gradle file changes.
// Both states build: the verification-metadata pins for the com.google.*
// artifacts were recorded from a build against a syntactically valid
// placeholder json (never committed), so a real file's build resolves
// against the same pinned bytes.
// ---------------------------------------------------------------------------
def googleServicesFile = file("google-services.json")
def firebaseWired = googleServicesFile.isFile()
if (firebaseWired) {
    apply plugin: "com.google.gms.google-services"
}

def versionPropertiesFile = file("../version.properties")
if (!versionPropertiesFile.isFile()) {
    throw new GradleException("Missing Android version file: ${versionPropertiesFile}")
}

def versionProperties = new Properties()
versionPropertiesFile.withInputStream { versionProperties.load(it) }

def tacendumVersionCodeText = versionProperties.getProperty("VERSION_CODE", "").trim()
def tacendumVersionName = versionProperties.getProperty("VERSION_NAME", "").trim()
if (!(tacendumVersionCodeText ==~ /[1-9][0-9]*/)) {
    throw new GradleException("VERSION_CODE must be a positive integer")
}
if (tacendumVersionName.isEmpty()) {
    throw new GradleException("VERSION_NAME must not be empty")
}
def tacendumVersionCode = tacendumVersionCodeText.toInteger()

def releaseSigningPropertyNames = [
    "tacendumUploadStoreFile",
    "tacendumUploadStorePassword",
    "tacendumUploadKeyAlias",
    "tacendumUploadKeyPassword",
]
def releaseSigningValues = releaseSigningPropertyNames.collectEntries { name ->
    [(name): findProperty(name)?.toString()]
}
def signingValuePresent = { value ->
    value != null && !value.trim().isEmpty()
}
def releaseStoreFile = signingValuePresent(
    releaseSigningValues.tacendumUploadStoreFile
)
    ? file(releaseSigningValues.tacendumUploadStoreFile)
    : file("${buildDir}/missing-upload-keystore")
def debugStoreFile = file("debug.keystore")
def repositoryRoot = rootProject.projectDir.parentFile.parentFile.canonicalFile

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    root = file("../../")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    cliFile = file("../../../node_modules/react-native/cli.js")
    hermesCommand = file("../../../node_modules/hermes-compiler/hermesc/%OS-BIN%/hermesc").absolutePath

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.miranatechnologies.tacendum"
    compileOptions {
        // REQUIRED BY libsignal-android 0.100.0, not chosen: its AAR metadata
        // declares core library desugaring, and AGP refuses to package it
        // otherwise ("requires core library desugaring to be enabled for
        // :app"). It backports the newer java.* APIs libsignal's Java code
        // uses to every device this app supports; without it the build fails
        // loud rather than shipping something that would crash on older
        // devices, which is the correct direction.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.miranatechnologies.tacendum"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode tacendumVersionCode
        versionName tacendumVersionName
        // FCM conditionals 4 and 5 (see the header block): the manifest's
        // declared-but-disabled FCM service, and the constant that lets the
        // running binary say which push truth it embodies.
        manifestPlaceholders.tacendumFcmEnabled = firebaseWired ? "true" : "false"
        buildConfigField "boolean", "TACENDUM_FCM", firebaseWired ? "true" : "false"
    }

    // BuildConfig is opt-in under AGP 8 (the call module's build.gradle
    // records the same fact); TACENDUM_FCM above is this module's first field.
    buildFeatures {
        buildConfig true
    }

    sourceSets {
        if (firebaseWired) {
            // FCM conditional 3: the one source file that cannot exist
            // without Firebase on the classpath.
            main.java.srcDirs += "src/play/java"
        }
    }

    testOptions {
        unitTests.all {
            testLogging {
                events "failed"
                exceptionFormat "full"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile debugStoreFile
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile releaseStoreFile
            storePassword releaseSigningValues.tacendumUploadStorePassword
            keyAlias releaseSigningValues.tacendumUploadKeyAlias
            keyPassword releaseSigningValues.tacendumUploadKeyPassword
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        resources {
            // The libsignal-client JAR is the DESKTOP artifact — it is where
            // libsignal-android's Java classes come from, and it carries
            // macOS/Windows/Linux natives as plain JAR RESOURCES at the root.
            // AGP's defaults drop `.so` but not `.dylib`/`.dll`, so without
            // these three lines a merge measured 55.8 MB compressed / 180 MB
            // uncompressed of Mac dylibs and Windows DLLs, packaged into an
            // Android APK where not one byte of it can execute. Measured
            // 2026-08-18 before excluding, which is why the numbers are here
            // rather than an assurance that it "would have been fine".
            //
            // Named narrowly rather than as `**/*.dylib`: the point is to
            // exclude libsignal's desktop build, and a blanket rule would
            // silently swallow the next dependency's resources too.
            excludes += [
                "libsignal_jni*.dylib",
                "libsignal_jni*.so",
                "signal_jni*.dll",
            ]
        }
    }
}

// libsignal ships a SECOND native library in every ABI of its AAR —
// `libsignal_jni_testing.so`, the testing-only build, larger than the real one
// — and nothing excludes it by default: a release APK would carry roughly half
// a gigabyte of code the app never calls, and would ship a testing binary to
// users. Release-scoped deliberately; debug keeps it
// so a debug build stays byte-comparable to what the AAR actually contains.
androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.packaging.jniLibs.excludes.add("**/libsignal_jni_testing.so")
    }
}

def readSigningCertificate = {
    File storeFile,
    String storePassword,
    String keyAlias,
    String keyPassword ->
    Exception lastFailure = null
    for (String storeType : ["JKS", "PKCS12"]) {
        try {
            def keyStore = java.security.KeyStore.getInstance(storeType)
            storeFile.withInputStream { stream ->
                keyStore.load(stream, storePassword.toCharArray())
            }
            def certificate = keyStore.getCertificate(keyAlias)
            def privateKey = keyStore.getKey(keyAlias, keyPassword.toCharArray())
            if (certificate == null || !(privateKey instanceof java.security.PrivateKey)) {
                throw new java.security.KeyStoreException(
                    "alias does not contain a private key"
                )
            }
            return certificate.getEncoded()
        } catch (Exception failure) {
            lastFailure = failure
        }
    }
    throw new GradleException(
        "Android release keystore credentials or alias are invalid",
        lastFailure,
    )
}

def verifyReleaseSigning = tasks.register("verifyReleaseSigning") {
    group = "verification"
    description = "Fails unless a distinct Android upload keystore is configured."

    doLast {
        def missing = releaseSigningPropertyNames.findAll {
            !signingValuePresent(releaseSigningValues[it])
        }
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Missing Android release signing properties: ${missing.join(', ')}"
            )
        }
        if (!releaseStoreFile.isFile()) {
            throw new GradleException(
                "Android release keystore does not exist: ${releaseStoreFile}"
            )
        }
        if (releaseStoreFile.canonicalFile == debugStoreFile.canonicalFile) {
            throw new GradleException(
                "Android release signing must not use the committed debug keystore"
            )
        }
        def releaseCanonicalFile = releaseStoreFile.canonicalFile
        def repositoryPrefix = repositoryRoot.path + File.separator
        if (
            releaseCanonicalFile == repositoryRoot ||
            releaseCanonicalFile.path.startsWith(repositoryPrefix)
        ) {
            throw new GradleException(
                "Android release keystore must be outside the repository"
            )
        }

        def releaseCertificate = readSigningCertificate(
            releaseCanonicalFile,
            releaseSigningValues.tacendumUploadStorePassword,
            releaseSigningValues.tacendumUploadKeyAlias,
            releaseSigningValues.tacendumUploadKeyPassword,
        )
        def debugCertificate = readSigningCertificate(
            debugStoreFile,
            "android",
            "androiddebugkey",
            "android",
        )
        if (java.util.Arrays.equals(releaseCertificate, debugCertificate)) {
            throw new GradleException(
                "Android release signing certificate must differ from the debug certificate"
            )
        }
    }
}

tasks.matching {
    it.name == "validateSigningRelease" || it.name == "signReleaseBundle"
}.configureEach {
    dependsOn(verifyReleaseSigning)
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // The desugaring runtime the compileOptions block above turns on. Pinned
    // deliberately; it exists only because libsignal-android requires
    // it, and it ships no cryptography of its own — it is the AOSP backport
    // of java.time/java.util.stream and friends.
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // FCM conditional 2 (see the header block). The BOM pins every
    // com.google.firebase artifact to one released set, and messaging is the
    // ONLY Firebase product this app takes: no analytics, no crashlytics,
    // nothing that phones home about the owner. The exact resolved versions
    // are additionally sha256-pinned in gradle/verification-metadata.xml,
    // where the com.google.firebase / com.google.android.gms /
    // com.google.android.datatransport / com.google.gms groups are excluded
    // from the trust rule — bytes that decide when this phone wakes must
    // match a recorded hash, exactly as libsignal's must.
    if (firebaseWired) {
        implementation platform("com.google.firebase:firebase-bom:34.3.0")
        implementation("com.google.firebase:firebase-messaging")
    }

    // The app module's JVM tests (PushWakeRouterTest): the same
    // junit the six module trees already pin.
    testImplementation("junit:junit:4.13.2")
}
