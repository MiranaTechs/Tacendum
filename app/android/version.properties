# THE ANDROID HALF OF ONE SHARED BUILD COUNTER.
#
# Gradle cannot read TypeScript, so this file is the machine-readable mirror
# of app/src/version.ts — VERSION_CODE mirrors BUILD, VERSION_NAME mirrors
# VERSION — and app/android/app/build.gradle reads it (`../version.properties`)
# rather than carrying literals of its own.
#
# NOTHING GENERATES THIS FILE. It is a mirror, and a mirror drifts: the number
# that has to change on an upload is the one in version.ts, and editing that
# without editing this would ship an .aab claiming a build number the app's own
# Settings screen denies. app/__tests__/version.test.ts is what makes that
# unlandable — it pins BOTH pairs, the pbxproj pair for iOS and this pair for
# Android, so a bump in one place and not the other fails `pnpm test` rather
# than reaching a store. Bump version.ts, then bump these two lines to match.
VERSION_CODE=26
VERSION_NAME=1.0
